<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABYO - Redefinir Senha de Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/register.css">
</head>
<body class="register-body">

  <div class="register-split-container" style="justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
    
    <div class="wizard-box" style="max-width: 460px; width: 100%; padding: 32px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="/" style="font-size: 1.6rem; font-weight: 900; color: #FFF; text-decoration: none; letter-spacing: -0.5px;">HABYO</a>
        <div style="font-size: 2.2rem; margin: 12px 0 6px 0;">🔑</div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #FFF;">Redefinir Sua Senha</h2>
        <p style="font-size: 0.85rem; color: #94A3B8; margin-top: 4px;">Crie uma nova senha segura para acessar sua conta no HABYO.</p>
      </div>

      <form id="resetPasswordForm">
        <div class="reg-form-group" style="margin-bottom: 16px;">
          <label class="reg-label" for="newPass">Nova Senha *</label>
          <input type="password" id="newPass" class="reg-input" placeholder="Nova senha (min. 6 caracteres)" required minlength="6" style="width: 100%;">
        </div>

        <div class="reg-form-group" style="margin-bottom: 20px;">
          <label class="reg-label" for="confirmNewPass">Confirmar Nova Senha *</label>
          <input type="password" id="confirmNewPass" class="reg-input" placeholder="Digite novamente a nova senha" required minlength="6" style="width: 100%;">
        </div>

        <div id="resetAlertBox" style="display:none; font-size:0.85rem; margin-bottom:16px; padding: 12px; border-radius: 8px; text-align:center;"></div>

        <button type="submit" class="btn-step-next" style="width:100%; padding: 14px; font-size: 0.95rem; font-weight: 800;">
          🔒 Salvar Nova Senha &rarr;
        </button>

        <div style="text-align: center; margin-top: 20px; font-size: 0.82rem; color: #94A3B8;">
          Lembrou da senha antiga? <a href="/login" style="color: #60A5FA; font-weight: 700; text-decoration: none;">Fazer Login</a>
        </div>
      </form>

    </div>
  </div>

  <script src="/reset-password.js"></script>
</body>
</html>
